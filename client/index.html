<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chronicle Cinema — Community for Independent Filmmakers</title>
    <meta name="description" content="A community platform for filmmakers, cinematographers, screenwriters, and editors to showcase cuts, critique work, and collaborate." />
    
    <!-- Theme anti-flash initialization: default to system theme or saved choice -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('blog_app_theme');
          var theme = (saved === 'dark' || saved === 'light') ? saved : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch(e) {}
      })();
    </script>

    <!-- Google Fonts: Oswald (Poster Display), Plus Jakarta Sans (Clean Sans), Courier Prime (Screenplay Monospace) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Oswald:wght@500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet" />

    <!-- Favicon -->

    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>

  </body>
</html>
